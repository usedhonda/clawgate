name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Leak guard
        run: bash scripts/security-leak-check.sh --all

      - name: Leak guard regressions
        run: bash scripts/security-leak-check.sh --self-test

  swift-test:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-xcode-26.3-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-xcode-26.3-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  # Keep the existing check name while using the complete suites as its evidence.
  line-smoke:
    needs: [swift-test, lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require full Swift and plugin validation
        env:
          SWIFT_RESULT: ${{ needs.swift-test.result }}
          PLUGIN_RESULT: ${{ needs.lint.result }}
        run: |
          if [[ "$SWIFT_RESULT" == "success" && "$PLUGIN_RESULT" == "success" ]]; then
            echo "LINE Swift and outbound coverage passed in the complete suites."
          else
            echo "Required suites did not succeed: Swift=$SWIFT_RESULT plugin=$PLUGIN_RESULT" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: ShellCheck
        run: shellcheck -S warning scripts/*.sh

      - name: JS syntax check
        run: find extensions -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Run plugin tests
        run: node --experimental-test-module-mocks --test extensions/openclaw-plugin/src/__tests__/*.test.js

      - name: Run Chrome extension tests
        run: node --test extensions/clawgate-chrome/*.test.js extensions/clawgate-chrome/tests/*.test.js

      - name: Run telemetry plugin tests
        run: node --test extensions/vibeterm-telemetry/src/__tests__/*.test.js

      - name: Support diagnostics privacy regression
        run: python3 -m unittest discover -s scripts/tests -p 'test_support_diagnostics.py'
